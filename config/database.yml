default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "sqr_finances" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "sqr_finances_secret" } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "sqr_finances_development" } %>

test:
  <<: *default
  database: sqr_finances_test

production:
  <<: *default
  database: sqr_finances_production
  username: sqr_finances
  password: <%= ENV["SQR_FINANCES_DATABASE_PASSWORD"] %>
